<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartEnergy Hub</title>
<style>
  :root { --bg:#0f1720; --panel:#17212c; --line:#2a3847; --text:#e6edf3; --muted:#8fa1b3; --accent:#4cc38a; --warn:#ff6b6b; --blue:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,"Segoe UI",sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:16px; align-items:center; justify-content:space-between; padding:16px 24px; border-bottom:1px solid var(--line); }
  h1 { font-size:20px; margin:0; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0 0 12px; }
  main { max-width:1200px; margin:0 auto; padding:20px 24px; display:grid; gap:16px; }
  .controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  select { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:7px 10px; font:inherit; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .tile, .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px 16px; }
  .tile b { display:block; font-size:24px; font-weight:600; font-variant-numeric:tabular-nums; }
  .tile span { color:var(--muted); font-size:13px; }
  .tile.alert b { color:var(--warn); }
  canvas { display:block; width:100%; height:320px; }
  .legend { display:flex; gap:18px; color:var(--muted); font-size:13px; margin-top:8px; flex-wrap:wrap; }
  .legend i { display:inline-block; width:12px; height:3px; vertical-align:middle; margin-right:6px; }
  .cols { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px; }
  table { width:100%; border-collapse:collapse; font-size:14px; font-variant-numeric:tabular-nums; }
  th { text-align:left; color:var(--muted); font-weight:500; }
  th, td { padding:5px 8px 5px 0; border-bottom:1px solid var(--line); }
  a { color:var(--blue); }
  .muted { color:var(--muted); }
  #status { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>SmartEnergy Hub</h1>
  <div class="controls">
    <select id="sensor" aria-label="Capteur"></select>
    <select id="range" aria-label="Période">
      <option value="0.25">15 minutes</option>
      <option value="1" selected>1 heure</option>
      <option value="6">6 heures</option>
      <option value="24">24 heures</option>
    </select>
    <a href="/swagger-ui.html">API</a>
    <span id="status"></span>
  </div>
</header>
<main>
  <section class="tiles">
    <div class="tile"><b id="latest">-</b><span>Dernière mesure (kW)</span></div>
    <div class="tile"><b id="avg">-</b><span>Moyenne (kW)</span></div>
    <div class="tile"><b id="max">-</b><span>Maximum (kW)</span></div>
    <div class="tile"><b id="energy">-</b><span>Énergie estimée (kWh)</span></div>
    <div class="tile"><b id="count">-</b><span>Mesures reçues</span></div>
    <div class="tile alert"><b id="over">-</b><span>Dépassements du seuil</span></div>
  </section>
  <section class="panel">
    <h2 id="chartTitle">Puissance</h2>
    <canvas id="chart"></canvas>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>Mesures</span>
      <span><i style="background:var(--blue)"></i>Prévision</span>
      <span><i style="background:var(--warn)"></i>Seuil et anomalies</span>
    </div>
  </section>
  <section class="cols">
    <div class="panel">
      <h2>Dernières anomalies</h2>
      <table><thead><tr><th>Heure</th><th>kW</th><th>z</th><th>Motif</th></tr></thead><tbody id="anomalies"></tbody></table>
    </div>
    <div class="panel">
      <h2>Capteur et modèle</h2>
      <table><tbody id="details"></tbody></table>
    </div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const fmt = (v, d = 2) => Number(v).toLocaleString('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d });
const time = t => new Date(t).toLocaleTimeString('fr-FR');

function text(cells) {
  const tr = document.createElement('tr');
  cells.forEach(c => { const td = document.createElement('td'); td.textContent = c; tr.appendChild(td); });
  return tr;
}

async function get(url) {
  const response = await fetch(url);
  return response.ok ? response.json() : null;
}

function draw(history, forecast, anomalies, threshold) {
  const canvas = $('chart');
  const ratio = window.devicePixelRatio || 1;
  const width = canvas.clientWidth, height = canvas.clientHeight;
  canvas.width = width * ratio; canvas.height = height * ratio;
  const c = canvas.getContext('2d');
  c.scale(ratio, ratio);
  c.clearRect(0, 0, width, height);
  const css = getComputedStyle(document.documentElement);
  const color = name => css.getPropertyValue(name).trim();
  const series = history.map(m => [new Date(m.timestamp).getTime(), m.powerKw]);
  const predicted = forecast.map(p => [new Date(p.at).getTime(), p.powerKw]);
  const all = series.concat(predicted);
  if (!all.length) { c.fillStyle = color('--muted'); c.fillText('Aucune donnée sur cette période', 20, 30); return; }
  const left = 44, right = 12, top = 10, bottom = 26;
  const xs = all.map(p => p[0]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs) || x0 + 1;
  const yMax = Math.max(threshold || 0, ...all.map(p => p[1])) * 1.1 || 1;
  const X = t => left + (t - x0) / Math.max(x1 - x0, 1) * (width - left - right);
  const Y = v => height - bottom - v / yMax * (height - top - bottom);
  c.font = '12px system-ui'; c.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const v = yMax * i / 4;
    c.strokeStyle = color('--line'); c.beginPath(); c.moveTo(left, Y(v)); c.lineTo(width - right, Y(v)); c.stroke();
    c.fillStyle = color('--muted'); c.fillText(fmt(v, 1), 6, Y(v) + 4);
  }
  for (let i = 0; i <= 4; i++) {
    const t = x0 + (x1 - x0) * i / 4;
    const label = new Date(t).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    c.fillStyle = color('--muted');
    c.fillText(label, Math.min(X(t), width - right - 34), height - 8);
  }
  if (threshold) {
    c.strokeStyle = color('--warn'); c.setLineDash([6, 5]);
    c.beginPath(); c.moveTo(left, Y(threshold)); c.lineTo(width - right, Y(threshold)); c.stroke();
    c.setLineDash([]);
  }
  const line = (points, stroke, dash) => {
    if (!points.length) return;
    c.strokeStyle = stroke; c.lineWidth = 1.6; c.setLineDash(dash);
    c.beginPath();
    points.forEach((p, i) => i ? c.lineTo(X(p[0]), Y(p[1])) : c.moveTo(X(p[0]), Y(p[1])));
    c.stroke(); c.setLineDash([]);
  };
  line(series, color('--accent'), []);
  line(series.slice(-1).concat(predicted), color('--blue'), [5, 4]);
  c.fillStyle = color('--warn');
  anomalies.forEach(a => {
    c.beginPath(); c.arc(X(new Date(a.at).getTime()), Y(a.powerKw), 3, 0, 7); c.fill();
  });
}

async function refresh() {
  const id = $('sensor').value;
  if (!id) return;
  const to = new Date();
  const from = new Date(to.getTime() - Number($('range').value) * 3600e3);
  const q = `from=${from.toISOString()}&to=${to.toISOString()}`;
  const wide = `from=${new Date(to.getTime() - 6 * 3600e3).toISOString()}&to=${to.toISOString()}`;
  const [sensor, latest, summary, history, anomalies, forecast] = await Promise.all([
    get(`/api/sensors/${id}`), get(`/api/measurements/${id}/latest`), get(`/api/analytics/${id}/summary?${q}`),
    get(`/api/measurements/${id}?${q}`), get(`/api/analytics/${id}/anomalies?${q}`),
    get(`/api/analytics/${id}/forecast?${wide}&horizonMinutes=30`)
  ]);
  $('latest').textContent = latest ? fmt(latest.powerKw) : '-';
  if (summary) {
    $('avg').textContent = fmt(summary.avgPowerKw);
    $('max').textContent = fmt(summary.maxPowerKw);
    $('energy').textContent = fmt(summary.energyKwh, 3);
    $('count').textContent = summary.measurementCount.toLocaleString('fr-FR');
    $('over').textContent = summary.overThresholdCount;
  }
  $('chartTitle').textContent = sensor ? `Puissance : ${sensor.name} (${sensor.sensorId})` : 'Puissance';
  draw((history || []).slice().reverse(), forecast ? forecast.predictions : [], anomalies || [], sensor && sensor.maxPowerKw);
  const rows = (anomalies || []).slice(-8).reverse();
  $('anomalies').replaceChildren(...(rows.length ? rows.map(a => text([time(a.at), fmt(a.powerKw), fmt(a.zScore, 1), a.reasons.join(', ')])) : [text(['Aucune', '', '', ''])]));
  const details = [];
  if (sensor) details.push(['Bâtiment', `${sensor.building}, étage ${sensor.floor}`], ['Seuil', `${fmt(sensor.maxPowerKw, 1)} kW`]);
  if (latest) details.push(['Dernière lecture servie par', latest.source]);
  details.push(forecast
    ? ['Prévision', `${forecast.model}, MAE ${fmt(forecast.mae, 3)} kW, RMSE ${fmt(forecast.rmse, 3)} kW`]
    : ['Prévision', 'données insuffisantes']);
  $('details').replaceChildren(...details.map(text));
  $('status').textContent = `Mis à jour à ${time(new Date())}`;
}

async function init() {
  const sensors = await get('/api/sensors') || [];
  $('sensor').replaceChildren(...sensors.map(s => new Option(`${s.sensorId} - ${s.name}`, s.sensorId)));
  const preferred = sensors.find(s => s.sensorId === 'SENSOR-003');
  if (preferred) $('sensor').value = preferred.sensorId;
  $('sensor').onchange = refresh;
  $('range').onchange = refresh;
  window.onresize = refresh;
  refresh();
  setInterval(refresh, 5000);
}
init();
</script>
</body>
</html>
