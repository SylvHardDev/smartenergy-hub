server:
  port: 8080
spring:
  application:
    name: analytics-service
  cassandra:
    contact-points: ${CASSANDRA_CONTACT_POINTS:localhost:9042}
    local-datacenter: datacenter1
    keyspace-name: smartenergy
    schema-action: none
    request:
      timeout: 10s
    connection:
      connect-timeout: 10s
      init-query-timeout: 10s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      repositories:
        enabled: false
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/smartenergy}
smartenergy:
  max-range-days: 31
  default-range-hours: 24
  z-score-threshold: 3.0
  forecast:
    period-seconds: ${FORECAST_PERIOD_SECONDS:3600}
    min-points: 30
    step-minutes: 5
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
springdoc:
  swagger-ui:
    path: /swagger-ui.html
